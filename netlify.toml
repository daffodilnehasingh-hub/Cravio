# Cravio — Netlify deploy config.
# Frontend is plain HTML/JS (no build step); API runs as one serverless
# function wrapping the Express app (backend/functions/api.js).
# Required Netlify environment variables: MONGODB_URI (Atlas), JWT_SECRET,
# CORS_ORIGIN (include https://cravio-mvp.netlify.app).

[build]
  publish = "frontend"
  functions = "backend/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
