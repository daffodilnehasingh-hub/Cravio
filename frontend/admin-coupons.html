<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Coupon Manager | Cravio</title><link rel="stylesheet" href="css/auth.css"><link rel="stylesheet" href="css/coupons.css">  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/design-system.css" />
  <script src="js/icons.js"></script>
</head><body><main class="coupon-shell"><header><a class="brand" href="index.html">cravio<span>.</span></a><a href="dashboard.html"><span class="ci" data-icon="home" data-size="14"></span> Dashboard</a></header><p class="eyebrow">PROMOTIONS</p><h1><span class="ci" data-icon="ticket" data-size="28"></span> Coupon manager</h1><p class="muted">Create and control promotional offers.</p><form id="couponForm" class="coupon-form"><h2>Create a coupon</h2><label>Coupon code<input name="code" required maxlength="24" pattern="[A-Za-z0-9_-]{3,24}" placeholder="WELCOME20"></label><label>Description<input name="description" maxlength="160" placeholder="20% off your order"></label><div class="form-grid"><label>Discount type<select name="discountType"><option value="percentage">Percentage (%)</option><option value="fixed">Fixed amount (₹)</option></select></label><label>Discount value<input name="discountValue" type="number" min="1" required></label><label>Maximum discount (₹)<input name="maxDiscount" type="number" min="0" placeholder="Optional"></label><label>Minimum order (₹)<input name="minOrderValue" type="number" min="0" value="0"></label><label>Valid for<select name="outletType"><option value="all">All outlets</option><option value="restaurant">Restaurants</option><option value="canteen">Canteens</option></select></label><label>Usage limit<input name="usageLimit" type="number" min="1" placeholder="Unlimited"></label><label>Expires at<input name="expiresAt" type="datetime-local"></label></div><button class="btn"><span class="ci" data-icon="plus" data-size="16"></span>Create coupon</button><p id="couponMessage" role="status"></p></form><h2>Existing coupons</h2><section id="couponList">Loading...</section></main><script src="js/admin-coupons.js"></script>
</body></html>
