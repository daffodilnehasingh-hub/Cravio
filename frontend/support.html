<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cravio Support</title><link rel="stylesheet" href="css/auth.css"><link rel="stylesheet" href="css/support.css">  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="css/design-system.css" />
  <script src="js/icons.js"></script>
</head><body><main class="support-shell"><header><a class="brand" href="index.html">cravio<span>.</span></a><a href="notifications.html">Notifications</a><a href="orders.html">My orders</a></header><p class="eyebrow"><span class="ci" data-icon="mail" data-size="14"></span> CRAVIO SUPPORT</p><h1>How can we help?</h1><p class="muted">Send us a message and follow the conversation below.</p><form id="ticketForm" class="support-form"><label>Subject<input name="subject" maxlength="100" required placeholder="Example: Missing item in my order"></label><label>Category<select name="category"><option value="order">Order issue</option><option value="delivery">Delivery</option><option value="payment">Payment</option><option value="account">Account</option><option value="other">Other</option></select></label><label>Related order (optional)<select name="orderId" id="orderSelect"><option value="">No specific order</option></select></label><label>Describe your issue<textarea name="message" maxlength="2000" required rows="4" placeholder="Tell us what happened..."></textarea></label><button type="submit" class="btn"><span class="ci" data-icon="mail" data-size="14"></span>Submit support request</button><p id="supportMessage" role="status"></p></form><h2>Your support requests</h2><section id="ticketList"><p>Loading requests...</p></section></main><script src="js/support.js"></script>
</body></html>
