<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Saved addresses | Cravio</title><link rel="stylesheet" href="css/styles.css"><link rel="stylesheet" href="css/address-book.css">  <link rel="icon" type="image/svg+xml" href="favicon.svg" />

</head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">C</span><span>cravio<span class="brand-dot">.</span></span></a><nav class="main-nav"><a class="nav-link" href="customer-dashboard.html">Dashboard</a><a class="nav-link" href="restaurants.html">Explore</a></nav><div class="header-actions"><button class="icon-button" id="themeToggle"><span class="ci" data-icon="moon" data-size="18"></span></button></div></header><main class="address-page"><div class="address-heading"><div><span class="eyebrow"><span class="ci" data-icon="map-pin" data-size="14"></span> YOUR PLACES</span><h1>Saved addresses</h1><p>Keep your home, hostel and other delivery locations ready for checkout.</p></div><a class="primary-link" href="checkout.html">Back to checkout</a></div><section class="address-panel"><h2 id="formTitle">Add a new address</h2><form id="addressForm"><input type="hidden" id="addressId"><div class="address-grid"><label>Address label<select id="label"><option>Home</option><option>Hostel</option><option>Work</option><option>Other</option></select></label><label>Full name<input id="fullName" required maxlength="80"></label><label>Phone number<input id="phone" required inputmode="numeric" maxlength="10"></label><label>PIN code<input id="pincode" required inputmode="numeric" maxlength="6"></label><label class="wide">House / Hostel / Building<input id="house" required maxlength="160"></label><label class="wide">Street / Area / Landmark<input id="area" required maxlength="160"></label></div><label class="default-check"><input type="checkbox" id="isDefault"> Make this my default address</label><div class="form-actions"><button class="primary-link" type="submit">Save address</button><button class="secondary-link" id="cancelEdit" type="button" hidden>Cancel</button></div></form><p id="message" role="status"></p></section><section><div class="saved-heading"><h2>Your addresses</h2><span id="addressCount"></span></div><div id="addressList" class="address-list"><p>Loading addresses…</p></div></section></main><div class="toast" id="toast" role="status"></div><script src="js/address-book.js"></script>
